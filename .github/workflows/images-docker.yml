# Construit les images Docker de Devra Gestion pour Raspberry Pi (ARM64) et pour un
# serveur classique (x86-64), et les publie dans GitHub Container Registry
# (ghcr.io/<compte>/devra-gestion…). Le Raspberry Pi ou le serveur les télécharge au lieu
# de les construire. Voir devra-gestion/docs/DEPLOIEMENT_RASPBERRY_PI.md et
# devra-gestion/docs/DEPLOIEMENT_SERVEUR.md.
#
# - à chaque mise à jour de main touchant devra-gestion/ : construction et publication
#   (étiquettes « latest » et « sha-<commit> », pour pouvoir revenir à une version) ;
# - dans une pull request modifiant les images : construction seule, pour vérification ;
# - à la demande : onglet Actions → « Images Docker » → « Run workflow ».
name: Images Docker

on:
  push:
    branches: [main]
    paths:
      - "devra-gestion/**"
      - "!devra-gestion/**/*.md"
      - "!devra-gestion/desktop/**"
      - "!devra-gestion/android/**"
      - ".github/workflows/images-docker.yml"
  pull_request:
    paths:
      - "devra-gestion/Dockerfile"
      - "devra-gestion/docker/**"
      - "devra-gestion/package-lock.json"
      - ".github/workflows/images-docker.yml"
  workflow_dispatch:

# Une seule construction à la fois par branche : la plus récente l'emporte.
concurrency:
  group: images-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Construire les images (ARM64 et x86-64)
    runs-on: ubuntu-latest
    # ARM64 : construction émulée (QEMU), bien plus lente qu'en natif.
    timeout-minutes: 150
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - name: Noms des images
        id: names
        run: |
          # Les noms d'images doivent être en minuscules.
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image de sauvegarde (services backup et restore)
        uses: docker/build-push-action@v6
        with:
          context: devra-gestion/docker/backup
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH }}
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.names.outputs.registry }}/devra-gestion-backup:latest
            ${{ steps.names.outputs.registry }}/devra-gestion-backup:${{ steps.names.outputs.version }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Image de l'application (services app et cron)
        uses: docker/build-push-action@v6
        with:
          context: devra-gestion
          target: runner
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH }}
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.names.outputs.registry }}/devra-gestion:latest
            ${{ steps.names.outputs.registry }}/devra-gestion:${{ steps.names.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Image des migrations (service migrate)
        uses: docker/build-push-action@v6
        with:
          context: devra-gestion
          target: tools
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH }}
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.names.outputs.registry }}/devra-gestion-tools:latest
            ${{ steps.names.outputs.registry }}/devra-gestion-tools:${{ steps.names.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=tools

      - name: Résumé
        if: env.PUSH == 'true'
        run: |
          {
            echo "### Images publiées"
            echo ""
            echo "Version : \`${{ steps.names.outputs.version }}\` (et \`latest\`)"
            echo ""
            echo "Raspberry Pi : \`docker compose pull && docker compose up -d --no-build\`"
            echo ""
            echo "Serveur : \`sudo /usr/local/sbin/claude-devra update\`"
          } >> "$GITHUB_STEP_SUMMARY"
