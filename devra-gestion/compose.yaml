# Déploiement de production (Raspberry Pi ou tout serveur Docker).
#   docker compose up -d --build
# Accès HTTPS depuis Internet : ajouter compose.cloudflare.yaml ou compose.caddy.yaml
# (variable COMPOSE_FILE dans .env). Voir docs/DEPLOIEMENT_RASPBERRY_PI.md.
name: devra-gestion

x-app-env: &app-env # La base est joignable sous le nom « db » sur le réseau interne de Docker.
  DATABASE_URL: postgresql://${POSTGRES_USER:-devra}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/${POSTGRES_DB:-devra_gestion}
  DATA_DIR: /data
  TZ: Europe/Zurich

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-devra_gestion}
      TZ: Europe/Zurich
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applique les migrations et crée le premier admin, puis s'arrête.
  migrate:
    build:
      context: .
      target: tools
    image: devra-gestion-tools:latest
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    image: devra-gestion:latest
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes:
      - app-data:/data
    # Accessible uniquement depuis le Raspberry Pi lui-même : l'accès depuis
    # Internet passe par Cloudflare Tunnel ou Caddy (HTTPS).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Tâches quotidiennes (devis expirés, factures d'abonnement, relances) :
  # appelle l'application chaque matin à CRON_TIME. Même image que l'application.
  cron:
    image: devra-gestion:latest
    restart: unless-stopped
    command: ["node", "docker/cron/scheduler.mjs"]
    # Le contrôle de santé de l'image vérifie le serveur web, absent de ce conteneur.
    healthcheck:
      disable: true
    environment:
      TZ: Europe/Zurich
      CRON_URL: http://app:3000/api/taches/quotidiennes
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET manquant dans .env}
      CRON_TIME: ${CRON_TIME:-06:00}
    depends_on:
      app:
        condition: service_started

  # Sauvegardes automatiques : base et fichiers chaque jour à BACKUP_TIME, conservées
  # BACKUP_RETENTION_DAYS jours dans BACKUP_DIR (et copiées vers BACKUP_REMOTE si
  # renseigné). Voir docs/SAUVEGARDES.md.
  backup:
    build:
      context: docker/backup
    image: devra-gestion-backup:latest
    restart: unless-stopped
    env_file: .env # variables RCLONE_CONFIG_* de la copie hors du Raspberry Pi
    environment: &backup-env
      TZ: Europe/Zurich
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-devra}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      PGDATABASE: ${POSTGRES_DB:-devra_gestion}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - app-data:/data:ro
      - ${BACKUP_DIR:-./sauvegardes}:/backups
    depends_on:
      # Après les migrations : la première sauvegarde contient déjà les tables.
      migrate:
        condition: service_completed_successfully

  # Restauration (lancée à la main, jamais au démarrage) :
  #   docker compose run --rm restore            liste les sauvegardes
  #   docker compose run --rm restore --test     vérifie la dernière sauvegarde
  restore:
    image: devra-gestion-backup:latest
    profiles: ["restauration"]
    entrypoint: ["restore.sh"]
    environment: *backup-env
    volumes:
      - app-data:/data
      - ${BACKUP_DIR:-./sauvegardes}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  app-data:
