# Services pour le développement local : la base PostgreSQL, Mailpit
# (faux serveur SMTP qui capture les emails : interface sur http://localhost:8025)
# et GreenMail (fausse boîte IMAP pour la section Mail : SMTP 3025, IMAP 3143).
# L'application elle-même tourne avec `npm run dev`.
name: devra-gestion-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devra
      POSTGRES_PASSWORD: devra
      POSTGRES_DB: devra_gestion
      TZ: Europe/Zurich
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devra -d devra_gestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Permet aux tests de simuler un refus du serveur SMTP (API /api/v1/chaos).
      MP_ENABLE_CHAOS: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Boîte relevée par la section Mail en développement et dans les tests :
  # IMAP sur 3143 (utilisateur boite@devra.test / boite-test), SMTP sur 3025
  # pour y déposer des emails « reçus des clients ».
  imap:
    image: greenmail/standalone:2.1.3
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=boite:boite-test@devra.test -Dgreenmail.users.login=email
        -Dgreenmail.verbose=false
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"

volumes:
  db-dev-data:
