<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <title>Gestion · Adresse du serveur</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #171717;
        --muted: #737373;
        --border: #e5e5e5;
        --accent: #171717;
        --accent-fg: #ffffff;
        --error: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #262626;
          --accent: #fafafa;
          --accent-fg: #171717;
          --error: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        margin-top: 16px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #erreur {
        min-height: 21px;
        margin: 10px 0 0;
        color: var(--error);
      }
      small {
        display: block;
        margin-top: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Adresse de l'outil de gestion</h1>
    <p>
      Indiquez l'adresse que vous utilisez dans votre navigateur pour ouvrir l'outil. Vous vous
      connecterez ensuite avec votre email et votre mot de passe habituels.
    </p>
    <form id="formulaire">
      <label for="adresse">Adresse</label>
      <input
        id="adresse"
        type="text"
        inputmode="url"
        autocomplete="url"
        placeholder="https://gestion.exemple.ch"
        required
        autofocus
      />
      <p id="erreur" role="alert"></p>
      <button id="valider" type="submit">Continuer</button>
    </form>
    <small>Vous pourrez la changer plus tard depuis l'icône de l'application.</small>
    <script>
      const champ = document.getElementById("adresse");
      const erreur = document.getElementById("erreur");
      const bouton = document.getElementById("valider");
      window.reglages.lire().then((r) => {
        if (r.serverUrl) champ.value = r.serverUrl;
      });
      document.getElementById("formulaire").addEventListener("submit", async (event) => {
        event.preventDefault();
        erreur.textContent = "";
        bouton.disabled = true;
        bouton.textContent = "Vérification…";
        const resultat = await window.reglages.enregistrer(champ.value);
        if (!resultat.ok) {
          erreur.textContent = resultat.error;
          bouton.disabled = false;
          bouton.textContent = "Continuer";
        }
      });
    </script>
  </body>
</html>
